{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Announcement</h2>

    <div class="alert alert-danger mt-3">
        Are you sure you want to delete <strong>{{ announcement.title }}</strong>?
        <br>
        This action cannot be undone.
    </div>

    <form method="post" data-confirm="Are you sure you want to delete this announcement?">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'announcement_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block page_title %}Disable Membership Plan{% endblock %}

{% block content %}

<style>
    .confirm-card {
        max-width: 640px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 1.5rem;
    }

    .confirm-card h2 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
    }

    .warning-box {
        padding: 1rem;
        margin-bottom: 1.25rem;
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        line-height: 1.5;
    }

    .form-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0.45rem 0.8rem;
        border-radius: 6px;
        border: 1px solid transparent;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
    }

    .btn-warning {
        background: #f59e0b;
        color: #ffffff;
        border-color: #f59e0b;
    }

    .btn-secondary {
        background: #ffffff;
        color: #374151;
        border-color: #d1d5db;
    }
</style>

<div class="confirm-card">
    <h2>Disable Membership Plan</h2>

    <div class="warning-box">
        Are you sure you want to disable <strong>{{ plan.name }}</strong>?
        <br>
        This will not delete the plan. Existing members will still keep it.
    </div>

    <form method="post" data-confirm="Are you sure you want to disable this plan?">
        {% csrf_token %}

        <div class="form-actions">
            <button type="submit" class="btn btn-warning">Yes, Disable</button>
            <a href="{% url 'plan_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}

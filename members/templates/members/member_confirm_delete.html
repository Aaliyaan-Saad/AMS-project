{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Member</h2>

    <div class="alert alert-danger mt-3">
        Are you sure you want to delete <strong>{{ member.full_name }}</strong>?
    </div>

    <form method="post" data-confirm="Are you sure you want to delete this member?">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'member_detail' member.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

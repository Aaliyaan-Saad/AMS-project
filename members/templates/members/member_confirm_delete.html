{% extends "base.html" %}

{% block page_title %}Delete Member{% endblock %}

{% block content %}

<style>
    .delete-card {
        max-width: 640px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 1.5rem;
    }

    .delete-card h2 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
    }

    .delete-warning {
        padding: 1rem;
        margin-bottom: 1.25rem;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: #fef2f2;
        color: #991b1b;
        line-height: 1.5;
    }

    .delete-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        border: 1px solid transparent;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
    }

    .btn-danger {
        background-color: #dc2626;
        color: #ffffff;
        border-color: #dc2626;
    }

    .btn-danger:hover {
        background-color: #b91c1c;
        border-color: #b91c1c;
    }

    .btn-secondary {
        background-color: #ffffff;
        color: #374151;
        border-color: #d1d5db;
    }

    .btn-secondary:hover {
        background-color: #f3f4f6;
    }
</style>

<div class="delete-card">
    <h2>Delete Member</h2>

    <div class="delete-warning">
        Are you sure you want to delete
        <strong>{{ member.full_name }}</strong>?
        This action cannot be undone.
    </div>

    <form method="post" data-confirm="Are you sure you want to delete this member?">
        {% csrf_token %}

        <div class="delete-actions">
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'member_detail' member.pk %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
